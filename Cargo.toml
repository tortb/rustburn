[workspace]
resolver = "2"
members = [
    "crates/rustburn-cli",
    "crates/rustburn-core",
    "crates/rustburn-report",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
# 仅用于本地仓库分析（revwalk/diff），不需要 ssh/https 远程传输，
# 关闭默认特性以消除 openssl-sys/libssh2 系统依赖，保证跨平台可移植构建。
git2 = { version = "0.19", default-features = false }
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
clap = { version = "4", features = ["derive"] }
askama = "0.12"
ureq = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
insta = "1"
tempfile = "3"
# 文件过滤：读取并遵守 .gitignore/.ignore/.rbignore，替代手写过滤逻辑
ignore = "0.4"
# 更新机制：SHA256 校验与 tar.gz/zip 解压
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
zip = "2"
