[workspace]
resolver = "2"
members = [
    "crates/rustburn-cli",
    "crates/rustburn-core",
    "crates/rustburn-report",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
git2 = "0.19"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
clap = { version = "4", features = ["derive"] }
askama = "0.12"
ureq = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
insta = "1"
tempfile = "3"
